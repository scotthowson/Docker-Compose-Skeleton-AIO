<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <text x="800" y="58" text-anchor="middle" fill="#e2e8f0" font-size="32" font-weight="700">DCS on Proxmox</text>
  <text x="800" y="90" text-anchor="middle" fill="#94a3b8" font-size="16">One hub builds one VM per stack and drives them all; one proxy. Every box is an ordinary DCS.</text>

  <!-- host frame -->
  <rect x="60" y="124" width="1480" height="800" rx="24" fill="#111a2e" stroke="#1e293b" stroke-width="2"/>
  <text x="96" y="164" fill="#f59e0b" font-size="19" font-weight="700">PROXMOX VE HOST OR CLUSTER</text>

  <!-- hub -->
  <rect x="560" y="200" width="480" height="132" rx="20" fill="#0d1f1c" stroke="url(#hub)" stroke-width="3" filter="url(#glow)"/>
  <text x="800" y="244" text-anchor="middle" fill="#34d399" font-size="24" font-weight="800">DCS HUB</text>
  <text x="800" y="270" text-anchor="middle" fill="#94a3b8" font-size="14">its own small LXC or VM</text>
  <text x="800" y="298" text-anchor="middle" fill="#e2e8f0" font-size="14">builds the VMs · fleet view · VM power · deploys to any VM</text>
  <text x="800" y="320" text-anchor="middle" fill="#e2e8f0" font-size="14">Discord bot · Cloudflare DNS · one route feed</text>

  <!-- proxmox api -->
  <rect x="1200" y="210" width="280" height="112" rx="18" fill="#1c1a12" stroke="#f59e0b" stroke-width="2"/>
  <text x="1340" y="250" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700">Proxmox API</text>
  <text x="1340" y="276" text-anchor="middle" fill="#cbd5e1" font-size="13">nodes · VMs · containers</text>
  <text x="1340" y="298" text-anchor="middle" fill="#cbd5e1" font-size="13">start · shutdown · reboot</text>

  <!-- hub → proxmox api -->
  <path d="M1042,266 L1196,266" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <rect x="1078" y="236" width="84" height="22" rx="11" fill="#1c1a12" stroke="#f59e0b"/>
  <text x="1120" y="251" text-anchor="middle" fill="#fbbf24" font-size="12">API token</text>

  <!-- hub → members -->
  <path d="M700,334 L340,468" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M800,334 L800,468" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M900,334 L1260,468" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <rect x="446" y="386" width="148" height="24" rx="12" fill="#0d1f1c" stroke="#34d399"/>
  <text x="520" y="402" text-anchor="middle" fill="#34d399" font-size="12">member API + token</text>
  <rect x="1006" y="386" width="148" height="24" rx="12" fill="#0d1f1c" stroke="#34d399"/>
  <text x="1080" y="402" text-anchor="middle" fill="#34d399" font-size="12">member API + token</text>

  <!-- proxmox api → member VMs (power) -->
  <path d="M1400,324 L1400,468" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ao)"/>
  <rect x="1338" y="386" width="124" height="24" rx="12" fill="#1c1a12" stroke="#f59e0b"/>
  <text x="1400" y="402" text-anchor="middle" fill="#fbbf24" font-size="12">power actions</text>

  <!-- traefik → hub feed -->
  <path d="M1002,600 C1090,590 1120,470 1044,320" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#av)"/>
  <rect x="1130" y="440" width="196" height="24" rx="12" fill="#1a1530" stroke="#a78bfa"/>
  <text x="1228" y="456" text-anchor="middle" fill="#c4b5fd" font-size="12">pulls the route feed every 10 s</text>

  <!-- member 1 -->
  <rect x="120" y="470" width="440" height="330" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="340" y="508" text-anchor="middle" fill="#22d3ee" font-size="18" font-weight="700">VM  media-services</text>
  <text x="340" y="530" text-anchor="middle" fill="#94a3b8" font-size="12">DCS member · Docker · one compose stack</text>
  <rect x="150" y="548" width="380" height="34" rx="10" fill="#132033" stroke="#1e3a5f"/>
  <text x="340" y="570" text-anchor="middle" fill="#e2e8f0" font-size="13">DCS API :9876 · built and joined by the hub</text>
  <g fill="#cbd5e1" font-size="13">
    <rect x="150" y="598" width="182" height="32" rx="9" fill="#1e293b"/><text x="241" y="619" text-anchor="middle">Plex</text>
    <rect x="348" y="598" width="182" height="32" rx="9" fill="#1e293b"/><text x="439" y="619" text-anchor="middle">Sonarr</text>
    <rect x="150" y="642" width="182" height="32" rx="9" fill="#1e293b"/><text x="241" y="663" text-anchor="middle">Radarr</text>
    <rect x="348" y="642" width="182" height="32" rx="9" fill="#1e293b"/><text x="439" y="663" text-anchor="middle">Prowlarr</text>
    <rect x="150" y="686" width="380" height="32" rx="9" fill="#1e293b"/><text x="340" y="707" text-anchor="middle">Jellystat · Navidrome · …</text>
  </g>
  <text x="340" y="752" text-anchor="middle" fill="#64748b" font-size="12">App-Data, users and backups stay on this VM</text>
  <text x="340" y="774" text-anchor="middle" fill="#64748b" font-size="12">works exactly the same without a hub</text>

  <!-- member 2 -->
  <rect x="580" y="470" width="440" height="330" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="800" y="508" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="700">VM  networking-security</text>
  <text x="800" y="530" text-anchor="middle" fill="#94a3b8" font-size="12">DCS member · Docker · one compose stack</text>
  <rect x="610" y="548" width="380" height="34" rx="10" fill="#132033" stroke="#1e3a5f"/>
  <text x="800" y="570" text-anchor="middle" fill="#e2e8f0" font-size="13">DCS API :9876 · built and joined by the hub</text>
  <g fill="#cbd5e1" font-size="13">
    <rect x="610" y="598" width="380" height="32" rx="9" fill="#2a1f45" stroke="#a78bfa"/><text x="800" y="619" text-anchor="middle" fill="#e9d5ff" font-weight="700">Traefik — routes for every VM</text>
    <rect x="610" y="642" width="182" height="32" rx="9" fill="#1e293b"/><text x="701" y="663" text-anchor="middle">Authelia</text>
    <rect x="808" y="642" width="182" height="32" rx="9" fill="#1e293b"/><text x="899" y="663" text-anchor="middle">CrowdSec</text>
    <rect x="610" y="686" width="380" height="32" rx="9" fill="#1e293b"/><text x="800" y="707" text-anchor="middle">Nextcloud · web apps · …</text>
  </g>
  <text x="800" y="752" text-anchor="middle" fill="#64748b" font-size="12">providers.http.endpoint = hub /traefik/dynamic</text>
  <text x="800" y="774" text-anchor="middle" fill="#64748b" font-size="12">each route targets &lt;VM IP&gt;:&lt;published port&gt;</text>

  <!-- member 3 -->
  <rect x="1040" y="470" width="440" height="330" rx="20" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
  <text x="1260" y="508" text-anchor="middle" fill="#f472b6" font-size="18" font-weight="700">VM  development-tools</text>
  <text x="1260" y="530" text-anchor="middle" fill="#94a3b8" font-size="12">DCS member · Docker · one compose stack</text>
  <rect x="1070" y="548" width="380" height="34" rx="10" fill="#132033" stroke="#1e3a5f"/>
  <text x="1260" y="570" text-anchor="middle" fill="#e2e8f0" font-size="13">DCS API :9876 · built and joined by the hub</text>
  <g fill="#cbd5e1" font-size="13">
    <rect x="1070" y="598" width="182" height="32" rx="9" fill="#1e293b"/><text x="1161" y="619" text-anchor="middle">Ollama</text>
    <rect x="1268" y="598" width="182" height="32" rx="9" fill="#1e293b"/><text x="1359" y="619" text-anchor="middle">Open WebUI</text>
    <rect x="1070" y="642" width="182" height="32" rx="9" fill="#1e293b"/><text x="1161" y="663" text-anchor="middle">Gitea</text>
    <rect x="1268" y="642" width="182" height="32" rx="9" fill="#1e293b"/><text x="1359" y="663" text-anchor="middle">Code Server</text>
    <rect x="1070" y="686" width="380" height="32" rx="9" fill="#1e293b"/><text x="1260" y="707" text-anchor="middle">Jupyter · LibreTranslate · …</text>
  </g>
  <text x="1260" y="752" text-anchor="middle" fill="#64748b" font-size="12">the hub shows its stacks and deploys into it</text>
  <text x="1260" y="774" text-anchor="middle" fill="#64748b" font-size="12">add as many VMs as you like</text>

  <!-- legend -->
  <g font-size="13">
    <rect x="120" y="852" width="14" height="14" rx="4" fill="#34d399"/><text x="144" y="864" fill="#cbd5e1">hub → member: DCS REST API</text>
    <rect x="580" y="852" width="14" height="14" rx="4" fill="#a78bfa"/><text x="604" y="864" fill="#cbd5e1">Traefik → hub: HTTP provider, one merged feed</text>
    <rect x="1040" y="852" width="14" height="14" rx="4" fill="#f59e0b"/><text x="1064" y="864" fill="#cbd5e1">hub → Proxmox: status and power</text>
  </g>
  <text x="800" y="962" text-anchor="middle" fill="#64748b" font-size="13">A single-host install is the same DCS with one box — nothing here is required to use it.</text>
</svg>
