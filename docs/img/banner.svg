<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">DCS Orchestrator</title>
  <desc id="banner-desc">The DCS logo, a stack of three layers, beside the name DCS Orchestrator and the lines: a self-hosted control plane for Docker Compose; stacks you can read, one dashboard, a Proxmox fleet where the VM is the stack.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx="0.14" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bn-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="bn-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bn-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="bn-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bn-low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#475569" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="bn-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="bn-dot" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="bn-card"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#bn-card)">
    <rect width="1280" height="320" fill="url(#bn-bg)"/>
    <rect width="1280" height="320" fill="url(#bn-grid)"/>
    <rect width="1280" height="320" fill="url(#bn-glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="24" fill="none" stroke="#1f2b45"/>

  <!-- the logo mark: three layers, the top one live -->
  <g transform="translate(176 166) scale(0.34) translate(-512 -596)">
    <ellipse cx="512" cy="742" rx="250" ry="52" fill="#000000" fill-opacity="0.45" filter="url(#bn-soft)"/>
    <path transform="translate(512 618)" d="M-262 0 L0 -131 L262 0 L0 131 Z" fill="url(#bn-low)" stroke="#cbd5e1" stroke-opacity="0.35" stroke-width="6" stroke-linejoin="round"/>
    <path transform="translate(512 528)" d="M-262 0 L0 -131 L262 0 L0 131 Z" fill="url(#bn-mid)" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
    <g transform="translate(512 438)">
      <path d="M-262 0 L0 -131 L262 0 L0 131 Z" fill="url(#bn-top)" stroke="#d1fae5" stroke-opacity="0.9" stroke-width="7" stroke-linejoin="round"/>
      <path d="M-262 0 L0 -131 L262 0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#022c22" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round">
        <line x1="-92" y1="-14" x2="40" y2="52"/>
        <line x1="-30" y1="-60" x2="102" y2="6"/>
        <line x1="-154" y1="34" x2="-46" y2="88"/>
      </g>
    </g>
    <circle cx="512" cy="307" r="16" fill="#a7f3d0" filter="url(#bn-dot)" fill-opacity="0.9"/>
    <circle cx="512" cy="307" r="11" fill="#a7f3d0"/>
    <circle cx="250" cy="438" r="12" fill="#67e8f9" filter="url(#bn-dot)"/>
    <circle cx="250" cy="438" r="9" fill="#a5f3fc"/>
    <circle cx="774" cy="438" r="12" fill="#67e8f9" filter="url(#bn-dot)"/>
    <circle cx="774" cy="438" r="9" fill="#a5f3fc"/>
    <line x1="512" y1="749" x2="512" y2="848" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
    <circle cx="512" cy="862" r="16" fill="#22d3ee" filter="url(#bn-dot)" fill-opacity="0.9"/>
    <circle cx="512" cy="862" r="11" fill="#a5f3fc"/>
    <circle cx="436" cy="886" r="7" fill="#67e8f9" fill-opacity="0.7"/>
    <circle cx="588" cy="886" r="7" fill="#67e8f9" fill-opacity="0.7"/>
  </g>

  <!-- name and tagline -->
  <text class="sans" x="340" y="118" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#e6edf7">DCS <tspan fill="url(#bn-word)">Orchestrator</tspan></text>
  <text class="sans" x="342" y="164" font-size="25" font-weight="600" fill="#e6edf7" fill-opacity="0.92">A self-hosted control plane for Docker Compose.</text>
  <text class="sans" x="342" y="198" font-size="19" font-weight="500" fill="#8ea0bd">Stacks you can read · one dashboard · a Proxmox fleet where the VM is the stack</text>

  <!-- what comes with it -->
  <g class="sans" font-size="16" font-weight="600">
    <g transform="translate(342 226)">
      <rect width="176" height="36" rx="18" fill="#111a2e" stroke="#1f2b45"/>
      <circle cx="20" cy="18" r="5" fill="#34d399"/>
      <text x="34" y="23.5" fill="#e6edf7">150+ templates</text>
    </g>
    <g transform="translate(530 226)">
      <rect width="208" height="36" rx="18" fill="#111a2e" stroke="#1f2b45"/>
      <circle cx="20" cy="18" r="5" fill="#22d3ee"/>
      <text x="34" y="23.5" fill="#e6edf7">330+ API endpoints</text>
    </g>
    <g transform="translate(750 226)">
      <rect width="280" height="36" rx="18" fill="#111a2e" stroke="#1f2b45"/>
      <circle cx="20" cy="18" r="5" fill="#fbbf24"/>
      <text x="34" y="23.5" fill="#e6edf7">Traefik · Authelia · CrowdSec</text>
    </g>
    <g transform="translate(1042 226)">
      <rect width="144" height="36" rx="18" fill="#111a2e" stroke="#1f2b45"/>
      <circle cx="20" cy="18" r="5" fill="#fb7185"/>
      <text x="34" y="23.5" fill="#e6edf7">Discord bot</text>
    </g>
  </g>
</svg>
