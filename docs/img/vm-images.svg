<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="556" viewBox="0 0 1000 556" role="img" aria-labelledby="vi-title vi-desc">
  <title id="vi-title">Purpose-built VM images, new in 4.0</title>
  <desc id="vi-desc">Two images. The node image is a Docker host and nothing else: Docker Engine with Compose, the QEMU guest agent, ssh with keys only, a small first-boot service that reads the Proxmox cloud-init drive, BIOS and UEFI boot from one disk, and a disk that grows with the VM. The hub image is the node image plus DCS, which starts as a hub on the first boot. Debian 13, Ubuntu 26.04, Fedora 44 and Arch Linux each have both images. Node images: Debian 236 MB download, 635 MB on disk, 140 MB of memory idle with Docker running; Ubuntu 373 MB, 815 MB, 190 MB; Fedora 383 MB, 829 MB, 210 MB; Arch Linux 419 MB, 975 MB, 180 MB.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #111a2e; stroke: #1f2b45; stroke-width: 1.2; }
    .cap { font-size: 11.5px; font-weight: 700; letter-spacing: 1.6px; }
    .h { fill: #e6edf7; font-size: 17px; font-weight: 800; }
    .p { fill: #8ea0bd; font-size: 12.5px; }
    .li { fill: #c7d3e6; font-size: 13px; }
    .cell { fill: #0b1220; stroke: #1f2b45; }
    .th { fill: #e6edf7; font-size: 13.5px; font-weight: 700; }
    .num { fill: #e6edf7; font-size: 13px; font-weight: 700; }
    .unit { fill: #8ea0bd; font-size: 11.5px; }
  </style>

  <rect x="0.5" y="0.5" width="999" height="555" rx="22" fill="#0b1220" stroke="#1f2b45"/>
  <text class="sans" x="32" y="44" font-size="20" font-weight="800" fill="#e6edf7">Purpose-built VM images</text>
  <rect x="306" y="27" width="92" height="22" rx="11" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.45"/>
  <text class="sans" x="352" y="42" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">new in 4.0</text>
  <text class="sans p" x="32" y="67" font-size="13.5">Small, single-purpose Docker hosts, built from <tspan class="mono" fill="#e6edf7" font-size="12.5">vm-images/</tspan> without root.</text>

  <!-- node image -->
  <g class="sans" transform="translate(32 88)">
    <rect class="panel" width="456" height="236" rx="14"/>
    <rect x="16" width="424" height="3" rx="1.5" fill="#22d3ee"/>
    <text class="cap" x="20" y="30" fill="#22d3ee">NODE IMAGE</text>
    <text class="h" x="20" y="56">A Docker host and nothing else</text>
    <text class="p" x="20" y="76">Made for the VMs of a fleet.</text>
    <g class="li">
      <circle cx="26" cy="102" r="3" fill="#22d3ee"/><text x="38" y="106.5">Docker Engine with the Compose plugin</text>
      <circle cx="26" cy="126" r="3" fill="#22d3ee"/><text x="38" y="130.5">QEMU guest agent · ssh with keys only</text>
      <circle cx="26" cy="150" r="3" fill="#22d3ee"/><text x="38" y="154.5"><tspan class="mono" font-size="12" fill="#e6edf7">dcs-init</tspan> reads Proxmox's cloud-init drive:</text>
      <text x="38" y="172">host name, user, keys, network, DNS</text>
      <circle cx="26" cy="194" r="3" fill="#22d3ee"/><text x="38" y="198.5">Boots with BIOS or UEFI from one disk</text>
      <circle cx="26" cy="218" r="3" fill="#22d3ee"/><text x="38" y="222.5">The disk grows to the size the VM is given</text>
    </g>
  </g>

  <!-- hub image -->
  <g class="sans" transform="translate(512 88)">
    <rect class="panel" width="456" height="236" rx="14"/>
    <rect x="16" width="424" height="3" rx="1.5" fill="#34d399"/>
    <text class="cap" x="20" y="30" fill="#34d399">HUB IMAGE</text>
    <text class="h" x="20" y="56">The node image, plus DCS</text>
    <text class="p" x="20" y="76">A hub that is ready when it boots.</text>
    <g class="li">
      <circle cx="26" cy="102" r="3" fill="#34d399"/><text x="38" y="106.5">Everything in the node image</text>
      <circle cx="26" cy="126" r="3" fill="#34d399"/><text x="38" y="130.5">A DCS checkout, moved into the user's home</text>
      <circle cx="26" cy="150" r="3" fill="#34d399"/><text x="38" y="154.5"><tspan class="mono" font-size="12" fill="#e6edf7">dcs-hub-init</tspan> runs the setup as a hub and</text>
      <text x="38" y="172">installs the boot services on the first boot</text>
      <circle cx="26" cy="194" r="3" fill="#34d399"/><text x="38" y="198.5">The console prints the dashboard's address</text>
      <circle cx="26" cy="218" r="3" fill="#34d399"/><text x="38" y="222.5">Open <tspan class="mono" font-size="12" fill="#e6edf7">http://&lt;ip&gt;:3000</tspan> and finish in the wizard</text>
    </g>
  </g>

  <!-- availability -->
  <g class="sans">
    <text class="cap" x="32" y="356" fill="#8ea0bd">WHICH IMAGES EXIST</text>
    <!-- header row -->
    <rect class="cell" x="32" y="368" width="96" height="36" rx="8"/>
    <rect class="cell" x="136" y="368" width="202" height="36" rx="8"/><text class="th" x="150" y="391">Debian 13</text>
    <rect class="cell" x="346" y="368" width="202" height="36" rx="8"/><text class="th" x="360" y="391">Ubuntu 26.04</text>
    <rect class="cell" x="556" y="368" width="202" height="36" rx="8"/><text class="th" x="570" y="391">Fedora 44</text>
    <rect class="cell" x="766" y="368" width="202" height="36" rx="8"/><text class="th" x="780" y="391">Arch Linux</text>
    <!-- node row -->
    <rect class="cell" x="32" y="412" width="96" height="54" rx="8"/><text class="th" x="48" y="444" fill="#22d3ee">Node</text>
    <rect class="cell" x="136" y="412" width="202" height="54" rx="8" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="150" y="436" xml:space="preserve"><tspan class="num">236 MB</tspan><tspan class="unit"> download</tspan></text>
    <text x="150" y="455" xml:space="preserve"><tspan class="num">635 MB</tspan><tspan class="unit"> disk · </tspan><tspan class="num">140 MB</tspan><tspan class="unit"> RAM</tspan></text>
    <rect class="cell" x="346" y="412" width="202" height="54" rx="8" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="360" y="436" xml:space="preserve"><tspan class="num">373 MB</tspan><tspan class="unit"> download</tspan></text>
    <text x="360" y="455" xml:space="preserve"><tspan class="num">815 MB</tspan><tspan class="unit"> disk · </tspan><tspan class="num">190 MB</tspan><tspan class="unit"> RAM</tspan></text>
    <rect class="cell" x="556" y="412" width="202" height="54" rx="8" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="570" y="436" xml:space="preserve"><tspan class="num">383 MB</tspan><tspan class="unit"> download</tspan></text>
    <text x="570" y="455" xml:space="preserve"><tspan class="num">829 MB</tspan><tspan class="unit"> disk · </tspan><tspan class="num">210 MB</tspan><tspan class="unit"> RAM</tspan></text>
    <rect class="cell" x="766" y="412" width="202" height="54" rx="8" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="780" y="436" xml:space="preserve"><tspan class="num">419 MB</tspan><tspan class="unit"> download</tspan></text>
    <text x="780" y="455" xml:space="preserve"><tspan class="num">975 MB</tspan><tspan class="unit"> disk · </tspan><tspan class="num">180 MB</tspan><tspan class="unit"> RAM</tspan></text>
    <!-- hub row -->
    <rect class="cell" x="32" y="474" width="96" height="40" rx="8"/><text class="th" x="48" y="499" fill="#34d399">Hub</text>
    <rect class="cell" x="136" y="474" width="202" height="40" rx="8" stroke="#34d399" stroke-opacity="0.45"/><text class="li" x="150" y="499">node image + DCS</text>
    <rect class="cell" x="346" y="474" width="202" height="40" rx="8" stroke="#34d399" stroke-opacity="0.45"/><text class="li" x="360" y="499">node image + DCS</text>
    <rect class="cell" x="556" y="474" width="202" height="40" rx="8" stroke="#34d399" stroke-opacity="0.45"/><text class="li" x="570" y="499">node image + DCS</text>
    <rect class="cell" x="766" y="474" width="202" height="40" rx="8" stroke="#34d399" stroke-opacity="0.45"/><text class="li" x="780" y="499">node image + DCS</text>
  </g>
  <text class="sans unit" x="32" y="538">Measured with the images' boot test and on Proxmox 9.2. RAM idle: memory in use without the file cache, with Docker running.</text>
</svg>
