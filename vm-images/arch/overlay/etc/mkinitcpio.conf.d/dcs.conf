# The initramfs of a DCS VM only finds the root file system by its label and mounts it: Arch's kernel has the disks a
# Proxmox VM has (virtio-scsi, virtio-blk, AHCI) and ext4 built in, so no driver goes into it and the boot needs no udev
# in the initramfs (the running system's udev sees the devices once). About 1 MB instead of 29. The three modules are the cloud-init
# CD-ROM that Proxmox attaches (ide2 on an i440fx machine: ata_piix, sr_mod, isofs); loaded here its probing runs while the boot goes on.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3)
