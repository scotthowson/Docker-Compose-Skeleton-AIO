# The boot loader settings of a DCS VM: read by update-grub in the VM (Debian, Ubuntu) and by dcs-grubcfg (Fedora, and the first
# grub.cfg of every image). The distribution adds its security module in 10-lsm.cfg.
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_TERMINAL="serial console"
GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200"
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3"
# systemd.tty.term.*: systemd 259 and later ask the console for its size and cursor position at boot and wait a third of a second for each
# answer; the serial line of a VM has nobody to give one. The console is declared a dumb terminal (no questions) and the serial getty a
# vt220, which is what a login over the serial port should be. (Measured: about 0.7 s of every boot.)
GRUB_CMDLINE_LINUX="console=tty0 console=ttyS0,115200n8 net.ifnames=0 systemd.tty.term.console=dumb systemd.tty.term.ttyS0=vt220"
GRUB_DISABLE_OS_PROBER=true
GRUB_DISABLE_RECOVERY=true
