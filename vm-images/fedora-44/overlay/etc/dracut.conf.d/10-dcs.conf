# The initramfs of a DCS VM holds only what finds the disk and its file system (the rest of the drivers load from the root
# file system): about 11 MB instead of the generic 30.
hostonly="no"
hostonly_cmdline="no"
compress="zstd"
dracutmodules+=" base rootfs-block udev-rules fs-lib kernel-modules "
drivers+=" virtio_scsi virtio_blk sd_mod ext4 "
filesystems+=" ext4 "
