name: VM images

# The purpose-built VM images (hub and node of every distribution in vm-images/images.json: Debian 13, Ubuntu 26.04, Fedora 44, Arch
# Linux): built without root, booted the way Proxmox boots them (BIOS and UEFI, on KVM) and checked. On a version tag they are
# attached to the release, next to SHA256SUMS, images.json and the Proxmox importer, and the hub downloads them from there.

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['vm-images/**', '.github/workflows/vm-images.yml']
  workflow_dispatch:

concurrency:
  group: vm-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: which images
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      reuse: ${{ steps.m.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release that changed nothing under vm-images/ would build the very same images again (eight builds, an hour of
          # runners): its release takes the images of the release before instead. A hub image taken over this way carries that
          # release's DCS and offers the update at its first start.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            prev=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -B1 -x -- "$TAG" | head -1 || true)
            if [[ -n "$prev" && "$prev" != "$TAG" ]] && git diff --quiet "$prev" "$TAG" -- vm-images \
               && [[ "$(gh release view "$prev" --json assets -q '[.assets[] | select(.name | endswith(".qcow2"))] | length' 2>/dev/null)" == "$(jq '(.images | length) * (.roles | length)' vm-images/images.json)" ]]; then
              echo "vm-images/ is the same as in $prev: its images are taken over"
              echo "reuse=$prev" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "matrix=$(jq -c '{distro: [.images[].id], role: .roles}' vm-images/images.json)" | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.role }} · ${{ matrix.distro }}
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # the test containers come from a mirror: Docker Hub limits anonymous pulls per address and the runners share addresses
      DCS_TEST_REGISTRY: public.ecr.aws/docker/library/
    steps:
      - uses: actions/checkout@v7

      - name: Room and KVM
        run: |
          # an image build needs ~10 GB of scratch space: drop what the runner carries and this job does not use
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          # QEMU may use /dev/kvm (nested virtualization is on for these runners)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm; df -h / | tail -1

      - name: Tools for the boot test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf genisoimage socat jq

      - name: Build and boot-test (BIOS and UEFI)
        run: vm-images/build.sh ${{ matrix.distro }} ${{ matrix.role }} --test

      - name: Keep the image
        uses: actions/upload-artifact@v6
        with:
          name: dcs-${{ matrix.role }}-${{ matrix.distro }}
          path: |
            vm-images/out/dcs-${{ matrix.role }}-${{ matrix.distro }}.qcow2
          retention-days: 7
          if-no-files-found: error

  publish:
    name: attach to the release
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.build.result == 'success' || needs.plan.outputs.reuse != '')
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.reuse == ''
        with:
          path: images
          merge-multiple: true

      - name: The images of the release before (nothing under vm-images/ changed)
        if: needs.plan.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.plan.outputs.reuse }}" --pattern 'dcs-*.qcow2' --dir images

      - name: Checksums and the Proxmox importer
        working-directory: images
        run: |
          cp ../vm-images/proxmox/dcs-proxmox.sh ../vm-images/images.json .
          sha256sum dcs-*.qcow2 > SHA256SUMS
          ls -la; cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a dash (vX.Y.Z-rc.N) is a pre-release: never the "latest release" (the importer's default download), never offered to the stable channel
          PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes $PRE
          gh release upload "$TAG" images/* --clobber
