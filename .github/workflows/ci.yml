name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq socat

      - name: Lint (bash -n, shellcheck, compose config, API reference)
        run: tests/lint.sh

      - name: Smoke tests (request handler over stdin)
        run: tests/smoke.sh

      - name: Setup dry run
        run: ./setup.sh --dry-run
