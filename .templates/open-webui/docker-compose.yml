services:
  ollama:
    container_name: Ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      # how much of a conversation a model keeps in mind (tokens): more takes more of the graphics card's memory
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Ollama/data:/root/.ollama
    # A graphics card is picked on the deploy sheet: AMD gets the ROCm build (ollama/ollama:rocm) with /dev/kfd and the
    # card's render node, NVIDIA a GPU reservation (NVIDIA Container Toolkit). Without one, models run on the processor.
    # The image has no curl or wget: `ollama list` asks the server itself.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  open-webui:
    container_name: Open-WebUI
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - OLLAMA_BASE_URL=http://ollama:11434
      # signs the sessions: generated at deploy, keep it (a new one signs everyone out)
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Open-WebUI/data:/app/backend/data
    ports:
      - "${PORT_OPEN_WEBUI:-3100}:8080"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
