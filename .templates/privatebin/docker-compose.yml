services:
  privatebin:
    container_name: PrivateBin
    image: privatebin/nginx-fpm-alpine:latest
    restart: unless-stopped
    # The image runs as "nobody" and takes no PUID/PGID: with the stack's own user it can write the data folder DCS
    # makes for it (as "nobody" every paste failed with "Error saving document")
    user: "${PUID:-1000}:${PGID:-1000}"
    # its scratch folders live in memory: a container made again never meets files an earlier one left there as another user
    tmpfs:
      - /run:exec,mode=1777
      - /tmp:mode=1777
      - /var/lib/nginx/tmp:mode=1777
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/PrivateBin/data:/srv/data
    ports:
      - "${PORT_PRIVATEBIN:-8888}:8080"
    mem_limit: 150M
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
