services:
  openspeedtest:
    container_name: OpenSpeedTest
    image: openspeedtest/latest:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${PORT_OPENSPEEDTEST:-3002}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
