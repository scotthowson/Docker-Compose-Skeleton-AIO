services:
  nut-upsd:
    container_name: NUT-UPSD
    image: upshift/nut-upsd:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - UPS_NAME=${UPS_NAME:-ups}
      - UPS_DESC=${UPS_DESC:-My UPS}
      - UPS_DRIVER=${UPS_DRIVER:-usbhid-ups}
      - UPS_PORT=${UPS_PORT:-auto}
      - API_USER=${NUT_API_USER:-upsmon}
      - API_PASSWORD=${NUT_API_PASSWORD:-changeme}
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "${PORT_NUT:-3493}:3493"
    healthcheck:
      test: ["CMD-SHELL", "upsc ${UPS_NAME:-ups}@localhost ups.status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
