services:
  autobrr:
    container_name: Autobrr
    image: ghcr.io/autobrr/autobrr:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      # listen on the container's network, not only inside the container
      - AUTOBRR__HOST=0.0.0.0
      - AUTOBRR__PORT=7474
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Autobrr:/config
    ports:
      - "${PORT_AUTOBRR:-7474}:7474"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:7474/api/healthz/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
