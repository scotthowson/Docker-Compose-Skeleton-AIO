services:
  metube:
    container_name: MeTube
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - UID=${PUID:-1000}
      - GID=${PGID:-1000}
      - DOWNLOAD_DIR=/downloads
      - STATE_DIR=/downloads/.metube
      - DEFAULT_THEME=${METUBE_THEME:-auto}
    ports:
      - "${PORT_METUBE:-8098}:8081"
    volumes:
      - ${METUBE_DOWNLOAD_PATH:-/srv/media/downloads/metube}:/downloads
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
