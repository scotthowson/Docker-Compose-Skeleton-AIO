services:
  nzbget:
    container_name: NZBGet
    image: lscr.io/linuxserver/nzbget:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # the sign-in of the web page and of the apps that send downloads to it
      - NZBGET_USER=${NZBGET_USER:-nzbget}
      - NZBGET_PASS=${NZBGET_PASSWORD}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/NZBGet/config:/config
      # the same folder, at the same path, that Sonarr and Radarr see
      - ${NZBGET_DOWNLOADS:-./App-Data/Downloads}:/downloads
    ports:
      - "${PORT_NZBGET:-6789}:6789"
    healthcheck:
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:6789/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
