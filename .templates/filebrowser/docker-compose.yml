services:
  filebrowser:
    container_name: FileBrowser
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    # The image keeps its settings in /config and its database in /database and runs as a
    # plain user: it runs as the stack's user so it can write the App-Data folders
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/FileBrowser/data:/srv
      - ${APP_DATA_DIR:-./App-Data}/FileBrowser/config:/config
      - ${APP_DATA_DIR:-./App-Data}/FileBrowser/database:/database
    ports:
      - "${PORT_FILEBROWSER:-8095}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
