services:
  maintainerr:
    container_name: Maintainerr
    image: ghcr.io/maintainerr/maintainerr:latest
    restart: unless-stopped
    # the image runs as a plain user: it runs as the stack's user so it can write the App-Data folder
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Maintainerr:/opt/data
    ports:
      - "${PORT_MAINTAINERR:-6246}:6246"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:6246/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
