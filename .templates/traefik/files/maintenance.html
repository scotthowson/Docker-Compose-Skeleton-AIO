<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Back soon</title>
  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; font-weight: 600; }
    p { margin: 0 0 1rem; color: #94a3b8; }
    .dot { display: inline-block; width: 0.6rem; height: 0.6rem; margin-right: 0.5rem; border-radius: 50%; background: #f59e0b; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-color-scheme: light) { body { background: #f8fafc; color: #0f172a; } p { color: #475569; } }
  </style>
</head>
<body>
  <main>
    <h1><span class="dot" aria-hidden="true"></span>Back soon</h1>
    <p>This service is being worked on and will be back shortly. Nothing is lost; please try again in a few minutes.</p>
  </main>
</body>
</html>
