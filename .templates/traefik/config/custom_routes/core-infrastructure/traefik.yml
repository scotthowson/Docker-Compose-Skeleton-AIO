# =============================================================================
# Traefik Dashboard Route
# =============================================================================
# This route file is auto-placed into the target stack's custom_routes
# directory at deploy time. Template variables (${TRAEFIK_DOMAIN:-example.com}, etc.)
# are substituted during deployment.
#
# Route files in custom_routes/ are auto-discovered by the Traefik file
# provider — changes are picked up within seconds (no restart needed).
# =============================================================================

# -----------------------------------------------------------------------------
# Router & Service
# -----------------------------------------------------------------------------
http:
  routers:
    traefik-router:
      entryPoints:
        - "websecure"
      rule: "Host(`traefik.${TRAEFIK_DOMAIN:-example.com}`)"
      service: "traefik"
      middlewares:
        - "traefik-chain"
        # Uncomment after deploying Authelia:
        # - "authelia-middlewares"
      tls: {}

  services:
    traefik:
      loadBalancer:
        servers:
          # The dashboard listens on 8080 INSIDE the container; TRAEFIK_PORT_DASHBOARD is only the port published on the host (8180 by default),
          # which does not exist on the Docker network: the route answered 502 for traefik.<domain> on every default deploy.
          - url: "http://Traefik:8080"

# -----------------------------------------------------------------------------
# Middleware Chains
# -----------------------------------------------------------------------------
# traefik-chain is on every route DCS writes. DCS adds the add-ons chosen at
# deploy time to it (cloudflarewarp first, then the CrowdSec bouncer and
# geoblock, so the visitor's own address is what they judge) and takes them out
# again when an add-on is switched off; their middlewares live in files of
# their own next to this one.
  middlewares:
    traefik-chain:
      chain:
        middlewares:
          - "https-redirect"
          - "securityHeaders"

    authelia-middlewares:
      chain:
        middlewares:
          - traefik-secure-headers
          - authelia
          - compress-gzip

# -----------------------------------------------------------------------------
# Security Middlewares
# -----------------------------------------------------------------------------
    https-redirect:
      redirectScheme:
        scheme: "https"
        permanent: true

    securityHeaders:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          server: ""
          X-Forwarded-Proto: "https"
        sslProxyHeaders:
          X-Forwarded-Proto: https
        referrerPolicy: "strict-origin-when-cross-origin"
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        customRequestHeaders:
          X-Forwarded-Proto: "https"
        contentTypeNosniff: true
        browserXssFilter: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 63072000
        stsPreload: true

    traefik-secure-headers:
      headers:
        customFrameOptionsValue: "SAMEORIGIN"
        sslProxyHeaders:
          X-Forwarded-Proto: "https"
        referrerPolicy: "same-origin"
        forceSTSHeader: true
        stsPreload: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000

    hsts-header:
      headers:
        customResponseHeaders:
          Strict-Transport-Security: max-age=63072000

# -----------------------------------------------------------------------------
# Authelia Forward Auth (uncomment authelia-middlewares above to enable)
# -----------------------------------------------------------------------------
    authelia:
      forwardauth:
        address: "http://Authelia:9091/api/verify?rd=https://auth.${TRAEFIK_DOMAIN:-example.com}/"
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email

# -----------------------------------------------------------------------------
# Access Control
# -----------------------------------------------------------------------------
    local-ipwhitelist:
      IPAllowList:
        sourceRange:
          - 127.0.0.1/32                              # Localhost
          - ${TRAEFIK_TRUSTED_LAN:-192.168.1.0/24}    # LAN subnet from the deploy

# -----------------------------------------------------------------------------
# Utility Middlewares
# -----------------------------------------------------------------------------
    compress-gzip:
      compress: {}

    limit:
      buffering:
        maxRequestBodyBytes: 200000000
        maxResponseBodyBytes: 200000000
        memRequestBodyBytes: 200000000
        memResponseBodyBytes: 200000000

# -----------------------------------------------------------------------------
# Plugin middlewares
# -----------------------------------------------------------------------------
# None are defined here: a middleware that names a plugin traefik.yml does not
# declare is refused, and the route that uses it answers 404. The add-ons
# (cloudflarewarp, geoblock, maintenance) are switched on at deploy time; DCS
# then declares the plugin and writes <name>.yml beside this file.

# =============================================================================
# TLS Configuration
# =============================================================================
# Mozilla Intermediate compatibility
# https://ssl-config.mozilla.org/#server=traefik&version=3.0&config=intermediate
# =============================================================================
    # ---- Shared header sets and chains (also used by user-written routes) ----
    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: strict-origin-when-cross-origin
        customRequestHeaders:
          X-Forwarded-Proto: https
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          server: ""
          X-Forwarded-Proto: "https,wss"
        hostsProxyHeaders:
          - X-Forwarded-Host
    security-headers:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          X-Forwarded-Proto: https
          server: ""
        customRequestHeaders:
          X-Forwarded-Proto: https
        sslProxyHeaders:
          X-Forwarded-Proto: https
        referrerPolicy: same-origin
        hostsProxyHeaders:
          - X-Forwarded-Host
        contentTypeNosniff: true
        browserXssFilter: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 63072000
        stsPreload: true
    nextcloud-secure-headers:
      headers:
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        referrerPolicy: "same-origin"
    cors-all:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
        customResponseHeaders:
          X-Forwarded-Proto: https
        accessControlAllowMethods:
          - OPTION
          - POST
          - GET
          - PUT
          - DELETE
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Requested-With
          - X-Forwarded-Proto
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
    secure-chain:
      chain:
        middlewares:
          - https-redirect
          - default-headers
    nextcloud-chain:
      chain:
        middlewares:
          - https-redirect
          - nextcloud-secure-headers
    nextcloud-redirectregex:
      redirectRegex:
        permanent: true
        regex: https://(.*)/.well-known/(?:card|cal)dav
        replacement: https://${1}/remote.php/dav
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
