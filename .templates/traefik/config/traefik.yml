# =============================================================================
# Traefik Static Configuration
# =============================================================================
# Main Traefik configuration — deployed by Docker Compose Skeleton.
# Template variables (${TRAEFIK_DOMAIN:-example.com}, etc.) are substituted at deploy time.
# Documentation: https://doc.traefik.io/traefik/
# =============================================================================

global:
  checkNewVersion: true
  sendAnonymousUsage: false

serversTransport:
  insecureSkipVerify: true

# -----------------------------------------------------------------------------
# Entry Points
# -----------------------------------------------------------------------------
entryPoints:
  web:
    address: ':80'
    forwardedHeaders:
      trustedIPs: &trustedIps
        # Cloudflare IPv4
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        # Cloudflare IPv6
        - '2400:cb00::/32'
        - '2606:4700::/32'
        - '2803:f800::/32'
        - '2405:b500::/32'
        - '2405:8100::/32'
        - '2a06:98c0::/29'
        - '2c0f:f248::/32'
        # Local network
        - ${TRAEFIK_TRUSTED_LAN:-192.168.1.0/24}
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ':443'
    forwardedHeaders:
      trustedIPs: *trustedIps
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: ${TRAEFIK_DOMAIN:-example.com}
            sans:
              - '*.${TRAEFIK_DOMAIN:-example.com}'

# -----------------------------------------------------------------------------
# Plugins (optional — uncomment to enable)
# -----------------------------------------------------------------------------
# Plugins Traefik downloads at start (versions pinned to a known-good set).
# Middlewares in custom_routes/ refer to them; Sablier and the CrowdSec bouncer
# are wired by DCS when those templates are deployed.
experimental:
  plugins:
    geoblock:
      moduleName: "github.com/PascalMinder/geoblock"
      version: "v0.3.3"
    cloudflarewarp:
      moduleName: "github.com/BetterCorp/cloudflarewarp"
      version: "v1.3.3"
    log4shell:
      moduleName: "github.com/traefik/plugin-log4shell"
      version: "v0.1.2"
    sablier:
      moduleName: "github.com/acouvreur/sablier"
      version: "v1.7.0-beta.15"
    crowdsec-bouncer-traefik-plugin:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.4.4"

providers:
  providersThrottleDuration: 2s

  # File provider — reads route configs from custom_routes/ directory
  # Each stack category has its own subdirectory matching DOCKER_STACKS
  file:
    directory: /etc/traefik/custom_routes
    watch: true

  # Docker provider — auto-discovers containers via Docker Socket Proxy
  docker:
    watch: true
    network: proxy
    defaultRule: 'Host(`{{ lower (trimPrefix `/` .Name )}}.${TRAEFIK_DOMAIN:-example.com}`)'
    exposedByDefault: false
    endpoint: 'tcp://Docker-Socket:2375'

# -----------------------------------------------------------------------------
# Dashboard
# -----------------------------------------------------------------------------
api:
  dashboard: true
  insecure: true

ping:
  entryPoint: "traefik"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log:
  level: INFO

# JSON access log on disk: CrowdSec reads it (mounted read-only into its container)
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100

# -----------------------------------------------------------------------------
# Certificate Resolvers
# -----------------------------------------------------------------------------
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${TRAEFIK_ACME_EMAIL:-admin@example.com}
      storage: /etc/traefik/acme.json
      # DCS keeps one of the two challenges below when the template is deployed:
      # a Cloudflare token (CF_DNS_API_TOKEN) selects the DNS challenge (wildcards,
      # no open port 80 needed), an empty token the HTTP challenge on port 80.
      # dcs-challenge: dns
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - '1.1.1.1:53'
          - '1.0.0.1:53'
      # dcs-challenge: http
      # httpChallenge:
      #   entryPoint: web
      # dcs-challenge: end
