services:
  dashdot:
    container_name: Dashdot
    image: mauricenino/dashdot:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - DASHDOT_WIDGET_LIST=os,cpu,storage,ram,network
    volumes:
      - /proc:/mnt/host/proc:ro
      - /sys:/mnt/host/sys:ro
      - /etc/os-release:/mnt/host/etc/os-release:ro
      # dash. finds a drive by the folders mounted from it: the usual places drives are mounted, read-only
      # (without them the storage widget says "no mount found"; add your own mount points the same way)
      - /mnt:/mnt/host/mnt:ro
      - /media:/mnt/host/media:ro
      - /home:/mnt/host/home:ro
    ports:
      - "${PORT_DASHDOT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
