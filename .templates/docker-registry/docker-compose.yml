services:
  registry:
    container_name: Docker-Registry
    image: registry:2
    restart: unless-stopped
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    ports:
      - "${PORT_REGISTRY:-5000}:5000"
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Docker-Registry/data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/v2/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  registry-ui:
    container_name: Docker-Registry-UI
    image: joxit/docker-registry-ui:latest
    restart: unless-stopped
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=${REGISTRY_TITLE:-Docker Registry}
      - NGINX_PROXY_PASS_URL=http://registry:5000
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_ELEMENTS_LIMIT=1000
    ports:
      - "${PORT_REGISTRY_UI:-5002}:80"
    depends_on:
      - registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
