services:
  obsidian-livesync:
    container_name: Obsidian-LiveSync
    image: couchdb:3
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - COUCHDB_USER=${COUCHDB_USER:-obsidian}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    ports:
      - "${PORT_COUCHDB:-5984}:5984"
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Obsidian-LiveSync/data:/opt/couchdb/data
      - ${APP_DATA_DIR:-./App-Data}/Obsidian-LiveSync/local.d:/opt/couchdb/etc/local.d
    healthcheck:
      test: ["CMD-SHELL", "curl -fso /dev/null -u \"$$COUCHDB_USER:$$COUCHDB_PASSWORD\" http://127.0.0.1:5984/_up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
