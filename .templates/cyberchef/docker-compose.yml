services:
  cyberchef:
    container_name: CyberChef
    image: ghcr.io/gchq/cyberchef:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${PORT_CYBERCHEF:-8550}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
