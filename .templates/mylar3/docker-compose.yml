services:
  mylar3:
    container_name: Mylar3
    image: lscr.io/linuxserver/mylar3:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Mylar3/config:/config
      - ${MYLAR3_COMICS:-./App-Data/Comics}:/comics
      # the same folder, at the same path, that the download client sees
      - ${MYLAR3_DOWNLOADS:-./App-Data/Downloads}:/downloads
    ports:
      - "${PORT_MYLAR3:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
