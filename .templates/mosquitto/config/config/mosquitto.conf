# =============================================================================
# Mosquitto — written by the DCS template. Edit, then restart the container.
# =============================================================================
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true

# Plain MQTT
listener 1883
protocol mqtt

# MQTT over WebSockets (browser clients)
listener 9001
protocol websockets

# true  = any client on your network may connect (fine on a LAN behind a firewall)
# false = clients must log in. Create the password file with
#           docker exec -it Mosquitto mosquitto_passwd -c /mosquitto/config/passwd <username>
#         then uncomment the password_file line and restart Mosquitto.
allow_anonymous ${MQTT_ALLOW_ANONYMOUS:-true}
# password_file /mosquitto/config/passwd
