services:
  stash:
    container_name: Stash
    image: stashapp/stash:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - STASH_PORT=9999
      # where the folders below sit inside the container
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
    volumes:
      # settings, database, scrapers and plugins
      - ${APP_DATA_DIR:-./App-Data}/Stash/config:/root/.stash
      # previews, thumbnails and transcodes Stash makes: this folder grows large
      - ${APP_DATA_DIR:-./App-Data}/Stash/generated:/generated
      - ${APP_DATA_DIR:-./App-Data}/Stash/metadata:/metadata
      - ${APP_DATA_DIR:-./App-Data}/Stash/cache:/cache
      - ${APP_DATA_DIR:-./App-Data}/Stash/blobs:/blobs
      # your collection
      - ${STASH_MEDIA:-./App-Data/Media}:/data
    ports:
      - "${PORT_STASH:-9999}:9999"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
