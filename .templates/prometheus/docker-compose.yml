services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    # The image runs as "nobody" and takes no PUID/PGID: as the stack's own user it can write the data folder DCS makes
    # for it (as "nobody" it stopped at once: "permission denied" on its query log)
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${HOST_PORT}:9090"
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Prometheus/data:/prometheus
      - ${APP_DATA_DIR:-./App-Data}/Prometheus/config:/etc/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
