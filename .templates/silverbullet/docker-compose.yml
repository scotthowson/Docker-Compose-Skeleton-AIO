services:
  silverbullet:
    container_name: SilverBullet
    image: ghcr.io/silverbulletmd/silverbullet:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      # The server starts as root and drops to this user, so the notes belong to the stack's user
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # One account, written as user:password
      - SB_USER=${SILVERBULLET_USER:-admin}:${SILVERBULLET_PASSWORD}
    ports:
      - "${PORT_SILVERBULLET:-3050}:3000"
    volumes:
      # The notes: plain Markdown files
      - ${APP_DATA_DIR:-./App-Data}/SilverBullet/space:/data
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:3000/.ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
