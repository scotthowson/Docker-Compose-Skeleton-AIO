services:
  wordpress:
    container_name: WordPress
    image: wordpress:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - WORDPRESS_DB_HOST=wordpress-db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_DB_NAME=wordpress
    ports:
      - "${PORT_WORDPRESS:-8280}:80"
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/WordPress/html:/var/www/html
    depends_on:
      wordpress-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  wordpress-db:
    container_name: WordPress-DB
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=wordpress
      - MARIADB_USER=wordpress
      - MARIADB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/WordPress/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
