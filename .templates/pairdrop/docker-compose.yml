services:
  pairdrop:
    container_name: PairDrop
    image: lscr.io/linuxserver/pairdrop:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - RATE_LIMIT=false
      - WS_FALLBACK=false
    ports:
      - "${PORT_PAIRDROP:-3015}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
