services:
  metabase:
    container_name: Metabase
    image: metabase/metabase:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - JAVA_TIMEZONE=${TZ:-UTC}
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_PLUGINS_DIR=/metabase-data/plugins
    ports:
      - "${PORT_METABASE:-3014}:3000"
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Metabase/data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
