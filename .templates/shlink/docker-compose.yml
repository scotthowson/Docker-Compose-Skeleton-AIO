services:
  shlink:
    container_name: Shlink
    image: shlinkio/shlink:stable
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - TIMEZONE=${TZ:-UTC}
      - DEFAULT_DOMAIN=${SHLINK_DOMAIN:-localhost:8380}
      - IS_HTTPS_ENABLED=${SHLINK_HTTPS:-false}
      - INITIAL_API_KEY=${SHLINK_INITIAL_API_KEY}
      - DB_DRIVER=sqlite
    ports:
      - "${PORT_SHLINK:-8380}:8080"
    volumes:
      - shlink-data:/etc/shlink/data
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:8080/rest/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  shlink-web:
    container_name: Shlink-Web
    image: shlinkio/shlink-web-client:stable
    restart: unless-stopped
    environment:
      - SHLINK_SERVER_URL=${SHLINK_PUBLIC_URL:-http://localhost:8380}
      - SHLINK_SERVER_API_KEY=${SHLINK_INITIAL_API_KEY}
      - SHLINK_SERVER_NAME=Shlink
    ports:
      - "${PORT_SHLINK_WEB:-8381}:8080"
    depends_on:
      - shlink
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  shlink-data: {}
