services:
  umami:
    container_name: Umami
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
      - DISABLE_TELEMETRY=1
    ports:
      - "${PORT_UMAMI:-3013}:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  umami-db:
    container_name: Umami-DB
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/Umami/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
