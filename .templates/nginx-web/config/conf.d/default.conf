# Default server block seeded by DCS on first deployment. Edit freely — this
# file lives in App-Data/Nginx/conf.d and is never overwritten by a redeploy.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
