services:
  nocodb:
    container_name: NocoDB
    image: nocodb/nocodb:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - NC_AUTH_JWT_SECRET=${NOCODB_JWT_SECRET}
      - NC_PUBLIC_URL=${NOCODB_PUBLIC_URL:-http://localhost:8470}
      - NC_DISABLE_TELE=true
    ports:
      - "${PORT_NOCODB:-8470}:8080"
    volumes:
      - ${APP_DATA_DIR:-./App-Data}/NocoDB/data:/usr/app/data
    healthcheck:
      test: ["CMD", "curl", "-fso", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
