<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Clock</title>

  <!-- ═══════════════════════════════════════════════════════════
       DCS Plugin Card — System Clock
       ═══════════════════════════════════════════════════════════
       A live clock widget demonstrating custom dashboard cards.

       IMPORTANT: Use transparent backgrounds so the parent's
       glass card effect shows through. The iframe is layered
       on top of the DCS glassmorphism card wrapper.

       See style.css for the separated stylesheet reference.
       Note: Since plugin cards load via blob URL, CSS and JS
       must be inlined in this file (external files won't resolve).
       The separate .css and .js files serve as documentation.
       ═══════════════════════════════════════════════════════════ -->

  <style>
    /* ── Reset ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Body: transparent for glass effect ── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: transparent;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Card Layout ── */
    .card {
      padding: 24px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* ── Time: gradient text ── */
    .time {
      font-size: clamp(1.5rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #34d399, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Date ── */
    .date {
      font-size: clamp(0.55rem, 1.5vw, 0.75rem);
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* ── Label with live dot ── */
    .label {
      font-size: 0.55rem;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>

<body>
  <!-- ── Card Content ── -->
  <div class="card">
    <div class="time" id="t">Loading...</div>
    <div class="date" id="d"></div>
    <div class="label">
      <span class="dot"></span>
      Plugin Card
    </div>
  </div>

  <!-- ── Script ── -->
  <script>
    var timeEl = document.getElementById('t');
    var dateEl = document.getElementById('d');

    function updateClock() {
      var now = new Date();
      timeEl.textContent = now.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
      dateEl.textContent = now.toLocaleDateString([], {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
